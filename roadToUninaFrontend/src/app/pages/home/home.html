<!-- ========== TOPBAR ========== -->
<header class="topbar">
  <a routerLink="/" class="topbar-brand">Road to Unina</a>

  <nav class="topbar-nav">
    <button class="topbar-link" (click)="openLeaderboardModal()">Classifica</button>

    <button class="topbar-link" (click)="openSearchModal()">Cerca Partite</button>

    @if (isLoggedIn) {
      <span class="topbar-user">Ciao, {{ username }}</span>
      <button class="topbar-link topbar-link--logout" (click)="logout()">Esci</button>
    } @else {
      <button class="topbar-link" (click)="openAuthModal('login')">Accedi</button>
    }
  </nav>
</header>

<!-- ========== CONTENUTO CENTRALE ========== -->
<main class="hero">
  <div class="hero-content">
    <h1 class="hero-title">Road to Unina</h1>
    <p class="hero-subtitle">Metti alla prova le tue conoscenze e scala la classifica</p>

    @if (isLoggedIn) {
      <button class="hero-btn" (click)="startOrResumeGame()">Inizia Partita</button>
    } @else {
      <button class="hero-btn hero-btn--disabled" disabled>
        <a (click)="openAuthModal('login'); $event.preventDefault()" href="#">Accedi</a> o
        <a (click)="openAuthModal('register'); $event.preventDefault()" href="#">Registrati</a> per
        iniziare a giocare
      </button>
    }
  </div>
</main>

<!-- ========== MODAL: Classifica ========== -->
@if (showLeaderboardModal()) {
  <app-leaderboard-modal (close)="closeModals()" />
}

<!-- ========== MODAL: Cerca partita ========== -->
@if (showSearchModal()) {
  <app-search-game-modal (close)="closeModals()" />
}

<!-- ========== MODAL: Ripresa Partita ========== -->
@if (showResumeModal()) {
  <app-resume-game-modal
    [games]="inProgressGames()"
    (close)="closeModals()"
    (resume)="resumeGame($event)"
    (abandon)="abandonGame($event)"
    (newGame)="startNewGame()"
  />
}

<!-- ========== MODAL: Auth (Login / Registrazione) ========== -->
@if (showAuthModal()) {
  <app-auth-modal [mode]="authMode()" (close)="closeModals()" (authenticated)="onAuthenticated()" />
}
